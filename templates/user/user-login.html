{% extends 'layout.html' %}

{% block title %}User Login{% endblock %}

{% block main %}
<h1>User Login</h1>
<form action="{% url 'UserApplication:loginUser' %}" method="POST">
    {% csrf_token %}
    {{ form }}
    {% if request.GET.next %}
    <input type="hidden" name="next" value="{{ request.GET.next }}" />
    {% endif %}
    <button type="submit">Submit</button>
</form>
{% endblock %}
